name: Auto Approve After Checks

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.setFailed('Could not find PR number');
              return;
            }
            core.setOutput('number', prNumber);
            return prNumber;

      - name: Check if already approved
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const hasApproval = reviews.some(
              review => review.state === 'APPROVED' && review.user.type === 'User'
            );

            core.setOutput('approved', hasApproval);
            return hasApproval;

      - name: Auto approve PR
        if: steps.check.outputs.approved == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
        run: |
          gh pr review ${{ steps.pr.outputs.number }} --approve --body "✅ Auto-approved: All CI checks passed!"
