name: Auto Approve After Checks

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.setFailed('Could not find PR number');
              return;
            }
            core.setOutput('number', prNumber);
            return prNumber;

      - name: Check if already approved
        id: check
        if: steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};

            // Get existing reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const hasApproval = reviews.some(
              review => review.state === 'APPROVED' && review.user.type === 'User'
            );

            // Set output as string for GitHub Actions
            core.setOutput('approved', String(hasApproval));

            if (hasApproval) {
              console.log(`ℹ️ PR #${prNumber} is already approved.`);
            } else {
              console.log(`✅ PR #${prNumber} will be auto-approved.`);
            }

            return hasApproval;

      - name: Auto approve PR
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          IS_APPROVED="${{ steps.check.outputs.approved }}"
          if [ "$IS_APPROVED" != "true" ]; then
            gh pr review "$PR_NUMBER" --repo ${{ github.repository }} --approve --body "✅ Auto-approved: All CI checks passed!"
          fi
