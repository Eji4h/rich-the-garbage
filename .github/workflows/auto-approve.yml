name: Auto Approve After Checks

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.setFailed('Could not find PR number');
              return;
            }
            core.setOutput('number', prNumber);
            return prNumber;

      - name: Get PR author and check if already approved
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_APPROVE_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const prAuthor = pr.user.login;
            const repoOwner = context.repo.owner;

            // Check if PR author is the repository owner
            const isOwnPR = prAuthor === repoOwner;

            // Get existing reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const hasApproval = reviews.some(
              review => review.state === 'APPROVED' && review.user.type === 'User'
            );

            // Determine if we should approve
            const shouldApprove = !hasApproval && !isOwnPR;

            // Set outputs as strings for GitHub Actions
            core.setOutput('approved', String(hasApproval));
            core.setOutput('isOwnPR', String(isOwnPR));
            core.setOutput('shouldApprove', String(shouldApprove));

            if (isOwnPR) {
              console.log(`⚠️ Skipping auto-approval: PR author (${prAuthor}) is the repository owner. GitHub doesn't allow self-approval.`);
            } else if (hasApproval) {
              console.log(`ℹ️ PR #${prNumber} is already approved.`);
            } else {
              console.log(`✅ PR #${prNumber} from ${prAuthor} will be auto-approved.`);
            }

            return { hasApproval, isOwnPR, shouldApprove };

      - name: Auto approve PR
        if: steps.check.outputs.shouldApprove == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}
        run: |
          gh pr review ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --approve --body "✅ Auto-approved: All CI checks passed!"
